name: Release Installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.4.0"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --no-pub
      - name: Stage IPA
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          /usr/bin/zip -qry "dist/daily-ios-${version}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/*.ipa
          if-no-files-found: error

  macos:
    name: macOS unsigned DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - run: flutter pub get
      - name: Disable signing for the unsigned DMG
        shell: bash
        run: |
          ruby -pi -e '
            gsub(%q{CODE_SIGN_IDENTITY = "Apple Development";}, %q{CODE_SIGN_IDENTITY = "-";})
            gsub(%q{CODE_SIGN_STYLE = Automatic;}, %q{CODE_SIGN_STYLE = Manual;})
            gsub(%r{DEVELOPMENT_TEAM = [A-Z0-9]+;}, %q{DEVELOPMENT_TEAM = "";})
          ' macos/Runner.xcodeproj/project.pbxproj
      - name: Build macOS app
        env:
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: flutter build macos --release --no-pub --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET="$GOOGLE_DESKTOP_CLIENT_SECRET"
      - name: Stage DMG
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist dmg-root
          cp -R build/macos/Build/Products/Release/Daily.app dmg-root/
          hdiutil create -volname Daily -srcfolder dmg-root -ov -format UDZO "dist/daily-macos-${version}-unsigned.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*.dmg
          if-no-files-found: error

  android:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - run: flutter pub get
      - name: Build Android release APK
        run: >-
          flutter build apk --release --no-pub
          --dart-define=DAILY_ANALYTICS_ENDPOINT=https://littlebit.tail6514a4.ts.net/v1/events
          --dart-define=DAILY_BUG_REPORT_ENDPOINT=https://littlebit.tail6514a4.ts.net/v1/bug-reports
      - name: Verify Android OAuth signing certificate
        shell: bash
        env:
          EXPECTED_ANDROID_OAUTH_SHA1: "3ab44a04827cb218654f34c67779291b256d2950"
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          actual_sha1="$($apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
            | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"
          test -n "$actual_sha1"
          if [ "$actual_sha1" != "$EXPECTED_ANDROID_OAUTH_SHA1" ]; then
            echo "Android signing SHA-1 does not match the Google OAuth client."
            echo "Expected: $EXPECTED_ANDROID_OAUTH_SHA1"
            echo "Actual:   $actual_sha1"
            exit 1
          fi
      - name: Stage APK
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/daily-android-${version}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows release ZIP and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Build Windows app
        shell: pwsh
        env:
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: flutter build windows --release --no-pub --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET="$env:GOOGLE_DESKTOP_CLIENT_SECRET"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found." }
          & $iscc "/DMyAppVersion=$version" tool\windows\installer.iss
      - name: Stage ZIP
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/daily-windows-$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [ios, macos, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: DailyCalendar ${{ inputs.tag }}
          body_path: docs/RELEASE_NOTES_3.4.0.md
          files: dist/*
          fail_on_unmatched_files: true
