name: Platform Builds

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test fixture archive safety
        run: python3 -m unittest discover -s tool/tests -p test_prepare_test_fixtures.py -v

      - name: Test
        run: flutter test

  apple-lms-test:
    name: Apple LMS session tests
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test LMS authentication scripts
        run: python3 -m unittest discover -s tool/tests -p test_lms_login_scripts.py -v

      - name: Test geolocator_apple one-time request cancellation
        run: python3 -m unittest discover -s tool/tests -p test_geolocator_apple_cancel.py -v

      - name: Test Siri request ownership and recurrence mutations
        run: |
          python3 -m unittest discover -s tool/tests -p test_signal_voice_lifecycle.py -v
          python3 -m unittest discover -s tool/tests -p test_siri_occurrence_mutation.py -v
          python3 -m unittest discover -s tool/tests -p test_widget_occurrence_action.py -v

      - name: Test Apple LMS session paths without skips
        run: |
          flutter test --no-pub --reporter json test/core/lms/lms_web_session_test.dart > apple-lms-results.json
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path('apple-lms-results.json').read_text().splitlines() if line.startswith('{')]
          completed = [event for event in events if event.get('type') == 'testDone' and not event.get('hidden', False)]
          assert len(completed) == 46, f'Expected all 46 LMS tests, got {len(completed)}'
          assert all(not event.get('skipped', False) and event.get('result') == 'success' for event in completed), 'Apple LMS tests must all execute and pass'
          assert any(event.get('type') == 'done' and event.get('success') is True for event in events), 'Missing successful suite completion'
          print('Apple LMS: all 46 tests executed and passed, including the 38 skipped on Linux')
          PYTHON

      - name: Upload Apple LMS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-lms-test-results
          path: apple-lms-results.json
          if-no-files-found: error

  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --no-pub

      - name: Android native regression tests
        working-directory: android
        # --stacktrace: the task failure reported no cause, so show it in the log.
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  windows-debug:
    name: Windows debug build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --debug --no-pub
      - name: Windows Hello native regression tests
        shell: pwsh
        run: |
          cmake -S windows -B build/windows/x64 -Dinclude_local_auth_windows_tests=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows/x64 --config Debug --target local_auth_windows_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/windows/x64/plugins/local_auth_windows -C Debug --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows widget action native regression tests
        shell: pwsh
        run: |
          cmake -S windows/tests -B build/windows-widget-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows-widget-tests --config Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/windows-widget-tests -C Debug --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: daily-windows-debug
          path: build/windows/x64/runner/Debug
          if-no-files-found: error
